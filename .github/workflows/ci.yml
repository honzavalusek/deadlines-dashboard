name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      # No ANTHROPIC_API_KEY is provided to this job, and that is deliberate
      # rather than an omission: the suite runs against a fake engine, so a run
      # that somehow reached the real API would fail here instead of quietly
      # costing money.
      - name: Tests
        run: pytest -q
