[project]
name = "deadlines-dashboard"
version = "0.1.0"
description = "AI deadline radar over Slack and email conversations"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22",
    "anthropic>=1.0",
    "argon2-cffi>=25.1",
    "jinja2>=3.1",
    "pydantic-settings>=2.15",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
